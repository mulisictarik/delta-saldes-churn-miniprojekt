name: CI

# Körs vid varje push och vid pull requests mot main, så att en PR visar
# om den är grön innan någon granskar den.
on:
  push:
  pull_request:
    branches: [main]
  # Gör att jobbet kan köras manuellt med valfri datafil (Actions → Run workflow)
  workflow_dispatch:
    inputs:
      datafil:
        description: "Datafil som ska kontrolleras, sökväg i repot"
        required: false
        default: data/kundbas.csv

jobs:
  datakontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[data]"

      # Filnamnet går via en miljövariabel i stället för direkt in i skriptet
      - name: Kontrollera datan mot schemat
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: python -m kontroller.schema "$DATAFIL"

  test:
    runs-on: ubuntu-latest
    strategy:
      # Alla versioner körs klart även om en fallerar, så vi ser exakt vilka som fungerar.
      fail-fast: false
      matrix:
        # Servern kör 3.11 och ska uppgraderas under året (ärende 2).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # cache: pip återanvänder nedladdade paket. Nyckeln bygger på pyproject.toml,
      # så cachen byts ut när beroendena ändras (ärende 1).
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # [dev] behövs för pytest. Utan den finns inte pytest på runnern (ärende F1).
      - run: pip install -e ".[dev]"

      - run: pytest

  train:
    # Ingen träning på data som inte klarar kontrollen eller på kod som inte klarar testerna.
    needs: [datakontroll, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Samma version som servern som gör ringlistan (3.11).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      # Skriver outputs/modell.joblib och outputs/matvarden.json med commit och data_sha256.
      - run: python -m churn.model

      # Varje jobb startar på en ny runner, så modellen skickas vidare som artefakt.
      # SHA i namnet gör att modellen går att spåra till exakt den commit som skapade den.
      - uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/

  utvardera:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      # Samma modell som train skapade, ingen ny träning.
      - uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs

      # Mätvärdena skrivs före tröskeln, så att de syns även när modellen stoppas.
      - name: Skriv mätvärden i sammanfattningen
        run: |
          echo "## Mätvärden" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Kvalitetsgrinden: felkod 1 om ROC AUC är under tröskeln (MIN_ROC_AUC, standard 0.70).
      - run: python -m churn.evaluate

  docker:
    # Paketerar exakt den modell som klarade utvärderingen.
    needs: utvardera
    runs-on: ubuntu-latest
    # packages: write behövs för att pusha till ghcr.io med GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    env:
      # Taggen är commitens SHA, så imagen går att spåra till koden och modellen.
      IMAGE: ghcr.io/mulisictarik/delta-saldes-churn-miniprojekt:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs

      # QEMU gör att runnern (amd64) kan bygga för arm64. Kursens Kubernetes-kluster kör arm64,
      # och en image byggd bara för amd64 ger "exec format error" där.
      - uses: docker/setup-qemu-action@v4

      # buildx behövs för att bygga för flera arkitekturer i samma image.
      - uses: docker/setup-buildx-action@v4

      # Först en amd64-image som laddas in lokalt på runnern, så att den kan smoke-testas.
      # cache-to sparar lagren, så att bygget för båda arkitekturerna nedan går snabbare.
      - name: Bygg imagen för smoke-testet
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: churn:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startar containern och kontrollerar att tjänsten svarar. Testar inte hur bra
      # modellen är, bara att imagen fungerar.
      - name: Smoke-test
        run: |
          docker run -d --name churn -p 8000:8000 churn:test
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"alder": 30, "region": "Stockholm", "abonnemang": "Bas", "manader_som_kund": 3, "manadskostnad": 149.0, "data_gb_per_manad": 12.5, "supportarenden_12m": 4}' \
            | tee svar.json
          # Ett giltigt svar är en sannolikhet. Exakt värde kontrolleras inte, det ändras
          # när modellen tränas om. Smoke-testet ska fånga en trasig tjänst, inte en sämre modell.
          python3 -c "import json; r = json.load(open('svar.json'))['risk']; assert 0 <= r <= 1, r"

      - name: Visa containerns logg om smoke-testet fallerar
        if: failure()
        run: docker logs churn

      # Bara granskad kod på main blir en image i registret, aldrig en pull request.
      - name: Logga in på ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bygger för både amd64 och arm64. På en pull request byggs båda men inget pushas,
      # så att vi ser att arm64-bygget fungerar innan det når main.
      - name: Bygg för amd64 och arm64 och pusha från main
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

  staging:
    # Samma manifest och samma image provas i ett kind-kluster på runnern innan produktion.
    needs: docker
    runs-on: ubuntu-latest
    env:
      NAMESPACE: tarik-mulisic
      IMAGE: churn:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: modell-${{ github.sha }}
          path: outputs

      - uses: docker/setup-buildx-action@v4

      # Lagren finns redan i cachen från docker-jobbet, så bygget går på några sekunder.
      - name: Bygg imagen för kind
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Starta kind
        uses: helm/kind-action@v1
        with:
          cluster_name: staging

      - name: Ladda in imagen i kind
        run: kind load docker-image "$IMAGE" --name staging

      - name: Rulla ut med Kustomize
        working-directory: k8s
        run: |
          kustomize edit set image churn="$IMAGE"
          kubectl create namespace "$NAMESPACE"
          kubectl apply -k .
          kubectl -n "$NAMESPACE" rollout status deployment/churn --timeout=180s

      - name: Smoke-test mot servicen
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/churn 8080:80 &
          for i in $(seq 1 20); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health | tee health.json
          python3 -c "import json, sys; c = json.load(open('health.json'))['commit']; sys.exit(c != '${{ github.sha }}')"
          curl -sf -X POST localhost:8080/predict \
            -H "Content-Type: application/json" \
            -d '{"alder": 30, "region": "Stockholm", "abonnemang": "Bas", "manader_som_kund": 3, "manadskostnad": 149.0, "data_gb_per_manad": 12.5, "supportarenden_12m": 4}' \
            | tee svar.json
          python3 -c "import json; r = json.load(open('svar.json'))['risk']; assert 0 <= r <= 1, r"

      - name: Visa läget i klustret om något fallerar
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get all
          kubectl -n "$NAMESPACE" describe deployment churn
          kubectl -n "$NAMESPACE" logs -l app=churn --tail=50

  deploy:
    needs: staging
    # Bara push till main. En pull request når aldrig klustret.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Miljön kräver mitt godkännande och det är bara här KUBECONFIG kan läsas.
    environment:
      name: produktion
      url: https://tarik-mulisic.89-167-53-206.sslip.io/health
    # Två utrullningar får aldrig köras samtidigt mot klustret.
    concurrency:
      group: produktion
      cancel-in-progress: false
    env:
      NAMESPACE: tarik-mulisic
      IMAGE: ghcr.io/mulisictarik/delta-saldes-churn-miniprojekt:${{ github.sha }}
      URL: https://tarik-mulisic.89-167-53-206.sslip.io
    steps:
      - uses: actions/checkout@v7

      # Filen finns bara under jobbet och tas bort med runnern.
      - name: Skriv kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl -n "$NAMESPACE" get deployments

      - name: Rulla ut med Kustomize
        id: apply
        working-directory: k8s
        run: |
          kustomize edit set image churn="$IMAGE"
          kubectl apply -k .
          kubectl -n "$NAMESPACE" annotate deployment/churn \
            kubernetes.io/change-cause="pipeline: ${GITHUB_SHA::7}" --overwrite

      - name: Vänta på utrullningen
        run: kubectl -n "$NAMESPACE" rollout status deployment/churn --timeout=300s

      # Tjänsten ska svara med exakt den commit som just testades.
      - name: Kontrollera /health
        run: |
          for i in $(seq 1 24); do
            commit=$(curl -sf "$URL/health" | python3 -c "import json, sys; print(json.load(sys.stdin)['commit'])" || true)
            echo "försök $i: $commit"
            [ "$commit" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Skriv utrullningen i sammanfattningen
        run: |
          echo "## Utrullning" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl -n "$NAMESPACE" rollout history deployment/churn >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Bara om något faktiskt har applicerats. Fallerar det före apply finns inget att rulla tillbaka.
      - name: Rulla tillbaka vid fel
        if: failure() && steps.apply.outcome == 'success'
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/churn
          kubectl -n "$NAMESPACE" rollout status deployment/churn --timeout=300s
